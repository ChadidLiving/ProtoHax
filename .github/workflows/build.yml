name: Build Debug APK

on:
  push:
    branches:
      - 稳定版  # 替换为你想自动构建的分支
  workflow_dispatch:  # 👈 这个就是“手动触发按钮”

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK (v4)
        uses: android-actions/setup-android@v4

      - name: Install specific SDK components
        run: |
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProtoHax-debug.apk
          path: app/build/outputs/apk/debug/*.apk        uses: actions/upload-artifact@v4
        with:
          name: ProtoHax-debug.apk
          path: app/build/outputs/apk/debug/*.apk        with:
          name: ProtoHax-debug.apk
          path: app/build/outputs/apk/debug/*.apk
